<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="資源教室的最新消息與活動剪影。" />
    <meta name="theme-color" content="#ffce00" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>資源教室</title>
    <script>
      // 畫面出現前先套用上次的主題，避免閃一下另一個主題；之後由 src/theme.js 接手
      try {
        const applied = JSON.parse(localStorage.getItem('resroom-theme-applied'));
        const root = document.documentElement;
        root.dataset.theme = applied?.mode ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        for (const [name, value] of Object.entries(applied?.colors ?? {})) root.style.setProperty(`--${name}`, value);
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
